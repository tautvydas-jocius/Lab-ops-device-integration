[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
  knolleary/PubSubClient
  bblanchon/ArduinoJson@^7
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=0        ; native USB handled by TinyUSB (needed for MSC)
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DBOARD_HAS_PSRAM
board_build.arduino.memory_type = qio_opi   ; N16R8-style boards; use qio_qspi for 2/4 MB quad PSRAM
