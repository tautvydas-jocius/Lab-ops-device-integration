[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
  knolleary/PubSubClient
  bblanchon/ArduinoJson@^7
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=0        ; native USB handled by TinyUSB (needed for MSC)
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DBOARD_HAS_PSRAM
board_build.arduino.memory_type = qio_opi   ; N16R8-style boards; use qio_qspi for 2/4 MB quad PSRAM

; M5Stack ATOM S3 Lite: ESP32-S3FN8, 8 MB flash, NO PSRAM, native USB-C, Grove (G1/G2), header G5-G8/G38/G39, button G41.
; UART to the balance (via an RS232 level shifter) on the Grove port: RX = G1, TX = G2. USB drop drive shrinks to 192 KB (no PSRAM).
[env:atoms3-lite]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
lib_deps =
  knolleary/PubSubClient
  bblanchon/ArduinoJson@^7
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DUART_RX_PIN=1
  -DUART_TX_PIN=2

; M5Stack AtomS3R: ESP32-S3-PICO-1-N8R8 (8 MB flash, 8 MB PSRAM), same Atom size/Grove port as the Lite.
; PSRAM type is octal per M5Stack's JP docs (CNX says quad): if the board boot-loops at PSRAM init, switch memory_type to qio_qspi.
; Grove G1/G2 for the balance UART (check the AtomS3R pin table before wiring). Full 4 MB USB drop drive.
[env:atoms3r]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
lib_deps =
  knolleary/PubSubClient
  bblanchon/ArduinoJson@^7
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DBOARD_HAS_PSRAM
  -DUART_RX_PIN=1
  -DUART_TX_PIN=2
