services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "127.0.0.1:1884:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 2 >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labops
      POSTGRES_USER: labops
      POSTGRES_PASSWORD: labops
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labops -d labops"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: ./server
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_scales && python manage.py runserver --insecure 0.0.0.0:8000"
    environment: &django-env
      POSTGRES_DB: labops
      POSTGRES_USER: labops
      POSTGRES_PASSWORD: labops
      POSTGRES_HOST: db
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_PREFIX: lab/devices
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:-local-dev-change-me}
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN:-}
    ports:
      - "127.0.0.1:8011:8000"
    depends_on:
      db: {condition: service_healthy}
      mosquitto: {condition: service_healthy}
  listener:
    build: ./server
    command: python manage.py mqtt_listener
    environment: *django-env
    depends_on:
      db: {condition: service_healthy}
      mosquitto: {condition: service_healthy}
  simulator:
    build: ./server
    working_dir: /app
    command: python /simulator/scale_sim.py --host mosquitto --port 1883
    volumes:
      - ./simulator:/simulator:ro,z
    environment:
      PYTHONUNBUFFERED: "1"
    depends_on:
      mosquitto: {condition: service_healthy}
    profiles: ["sim"]
volumes:
  postgres-data:
  mosquitto-data:
